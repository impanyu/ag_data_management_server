<!DOCTYPE html>
<html>
<head>
    <title>🚨 EMERGENCY ArcGIS Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #test-indicator { 
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: red; 
            color: white; 
            padding: 10px; 
            z-index: 99999; 
            font-weight: bold;
        }
        #mapDiv { width: 100%; height: 400px; border: 3px solid red; }
    </style>
</head>
<body>
    <h1>🚨 EMERGENCY ArcGIS Test Page</h1>
    <div id="test-indicator">🚨 LOADING TEST...</div>
    
    <p><strong>This is a test to see if ArcGIS loads at all.</strong></p>
    <p>If you see a Google Map below instead of ArcGIS, then there's a fundamental issue.</p>
    
    <div id="mapDiv"></div>
    
    <script>
        console.log('🚨 EMERGENCY: Test page script running');
        document.getElementById('test-indicator').innerHTML = '🚨 TEST SCRIPT LOADED';
    </script>
    
    <!-- Load ArcGIS API -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.28/"></script>
    
    <script>
        require([
            "esri/Map", 
            "esri/views/MapView"
        ], function(Map, MapView) {
            console.log('🚨 EMERGENCY: ArcGIS modules loaded successfully!');
            document.getElementById('test-indicator').innerHTML = '🚨 ARCGIS LOADED!';
            document.getElementById('test-indicator').style.background = 'green';
            
            // Create map
            const map = new Map({
                basemap: "satellite"
            });

            // Create view
            const view = new MapView({
                container: "mapDiv",
                map: map,
                center: [-96.644, 40.897],
                zoom: 11
            });
            
            console.log('🚨 EMERGENCY: ArcGIS map created successfully!');
        });
    </script>
</body>
</html>
